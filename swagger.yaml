openapi: 3.0.3
info:
  title: Oficina Mecânica API
  description: |
    API REST do Sistema Integrado de Atendimento e Execução de Serviços.

    **Arquitetura:** Domain-Driven Design (DDD) em PHP 8.2 puro, sem frameworks MVC.

    **Autenticação (Fase 3):** um único bearer JWT **HS256** vale para os dois perfis. O token
    de `role=customer` é emitido pela Lambda `auth-cpf` (`POST /auth/cpf`); o de `role=admin` é
    emitido pela própria aplicação (`POST /api/auth/login`). Ambos usam o mesmo segredo
    (`JWT_SECRET`) e o mesmo emissor (`iss: oficina-mecanica-api`), e a aplicação **revalida o
    token localmente** em toda rota protegida — headers injetados pelo API Gateway nunca são
    considerados confiáveis.

    Claims: `sub` (id do cliente quando `customer`, usuário admin quando `admin`), `role`,
    `iss`, `iat`, `exp` e, só para `customer`, `cpf` e `name`.

    **Matriz de autorização:**

    | Rota | Acesso |
    |---|---|
    | `GET /api/health` | público — liveness, não toca no banco |
    | `GET /api/ready` | público — readiness, checa o banco |
    | `POST /auth/cpf` | público (API Gateway → Lambda) |
    | `POST /api/auth/login` | público (admin obtém o token) |
    | `POST /api/service-orders/{id}/approval` | header `X-Webhook-Token` **obrigatório** |
    | `GET /api/service-orders/me` | `customer` ou `admin` |
    | `GET /api/service-orders/{id}` | `admin`, ou o `customer` dono da ordem |
    | **todo o resto de `/api/**`** | `admin` |

    Ou seja: exceto `health`, `ready`, `login`, `approval`, `me` e a consulta de uma ordem pelo
    próprio dono, **todas as demais rotas exigem `role=admin`** e respondem `403` para um token
    de cliente.

    **Erros:** Todos os erros retornam `{"error": "mensagem descritiva"}`. Códigos:
    - `400` — Campos obrigatórios ausentes ou inválidos
    - `401` — Token ausente, inválido ou expirado
    - `403` — Token válido, mas sem o perfil exigido pela rota
    - `404` — Recurso não encontrado (também usado quando um cliente consulta ordem de outro,
      para não revelar a existência do recurso)
    - `422` — Violação de regra de negócio
    - `500` — Erro interno do servidor

    > O rate limit de login deixou de ser feito na aplicação (contador em arquivo, inútil com
    > múltiplos Pods) e passou a ser throttling do API Gateway.
  version: 1.0.0
  contact:
    name: Oficina Mecânica API

servers:
  - url: http://localhost:8080/api
    description: Ambiente local Docker (rotas `/api/**`)
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/api
    description: API Gateway (hml/prod) — rotas `/api/**` via VPC Link até a aplicação
    variables:
      apiId:
        default: xxxxxxxxxx
        description: Id do HTTP API publicado em /oficina/<env>/apigw/api_id

tags:
  - name: Sistema
    description: Health check e monitoramento
  - name: Autenticação
    description: Geração de token JWT
  - name: Clientes
    description: Gerenciamento de clientes
  - name: Veículos
    description: Gerenciamento de veículos
  - name: Peças
    description: Catálogo e controle de estoque de peças
  - name: Serviços
    description: Catálogo de serviços e métricas
  - name: Ordens de Serviço
    description: Ciclo de vida completo das ordens de serviço

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer JWT **HS256** — o mesmo esquema serve aos dois perfis:

        - `role=admin`: token de `POST /api/auth/login` (`sub` = usuário admin).
        - `role=customer`: token de `POST /auth/cpf`, emitido pela Lambda de autenticação
          (`sub` = id do cliente, mais as claims `cpf` e `name`).

        A aplicação valida assinatura e expiração localmente e aplica a matriz de autorização
        descrita na introdução: fora das exceções listadas lá, `/api/**` exige `role=admin`.

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Token expirado ou invalido
    Forbidden:
      description: Token válido, porém sem o perfil exigido pela rota
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Acesso negado.
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Dados de entrada inválidos ou obrigatórios ausentes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Regra de negócio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Mensagem de erro descritiva.

    CustomerStatus:
      type: string
      description: |
        Situação cadastral do cliente. Apenas `ACTIVE` autentica em `POST /auth/cpf`;
        `INACTIVE` e `BLOCKED` recebem `403`.
      enum:
        - ACTIVE
        - INACTIVE
        - BLOCKED
      default: ACTIVE
      example: ACTIVE

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: João da Silva
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), apenas dígitos
          example: "52998224725"
        status:
          $ref: '#/components/schemas/CustomerStatus'
        email:
          type: string
          format: email
          nullable: true
          description: E-mail de contato; `null` quando não informado
          example: joao.silva@example.com
        phone:
          type: string
          nullable: true
          description: |
            Telefone de contato normalizado para apenas dígitos (DDD + número, 10 a 13 dígitos);
            `null` quando não informado
          example: "11987654321"
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name: João da Silva
        document: "52998224725"
        status: ACTIVE
        email: joao.silva@example.com
        phone: "11987654321"

    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        license_plate:
          type: string
          description: Formato antigo (ABC-1234) ou Mercosul (ABC1D23)
          example: ABC-1234
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Corolla
        year:
          type: integer
          minimum: 1886
          example: 2020

    Part:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
          example: Filtro de óleo
        price:
          type: number
          format: float
          example: 45.90
        stock_quantity:
          type: integer
          example: 50

    ServiceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
          example: Troca de óleo
        base_price:
          type: number
          format: float
          example: 150.00
        estimated_time_minutes:
          type: integer
          example: 60

    ServiceItemMetric:
      type: object
      properties:
        service_item_id:
          type: string
          format: uuid
        description:
          type: string
          example: Troca de óleo
        estimated_time_minutes:
          type: integer
          example: 60
        times_executed:
          type: integer
          description: Quantidade de ordens de serviço que usaram este serviço
          example: 12
        total_estimated_minutes:
          type: integer
          description: Total acumulado de minutos estimados para este serviço
          example: 720

    OrderStatus:
      type: string
      enum:
        - RECEIVED
        - DIAGNOSIS
        - AWAITING_APPROVAL
        - EXECUTING
        - REJECTED
        - FINISHED
        - DELIVERED

    ServiceOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer:
          $ref: '#/components/schemas/Customer'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        status:
          $ref: '#/components/schemas/OrderStatus'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItem'
        parts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              description:
                type: string
              price:
                type: number
              stock_quantity:
                type: integer
              quantity:
                type: integer
        total_amount:
          type: number
          format: float
          example: 285.80
        created_at:
          type: string
          format: date-time

security:
  - BearerAuth: []

paths:
  # ── Sistema ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Sistema]
      summary: Liveness — o processo está vivo
      description: |
        Sonda de **liveness** do Kubernetes. **Não toca no banco de dados**: uma sonda de
        liveness acoplada ao banco transforma uma instabilidade momentânea do RDS em reinício
        em cascata de todos os Pods. A saúde do banco é responsabilidade de `GET /api/ready`.

        Sempre responde `200` enquanto o processo consegue atender.
      security: []
      responses:
        '200':
          description: Processo vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
              example:
                status: ok
                version: 1.0.0
                timestamp: '2026-08-26T22:31:04+00:00'

  /ready:
    get:
      tags: [Sistema]
      summary: Readiness — dependências disponíveis
      description: |
        Sonda de **readiness**: executa `SELECT 1` no banco. Falhando, o Pod é retirado do
        balanceador (`503`) sem ser reiniciado.
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                    example: ready
                  version:
                    type: string
                    example: 1.0.0
                  database:
                    type: string
                    enum: [connected]
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Banco de dados indisponível — Pod não está pronto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [not_ready]
                    example: not_ready
                  version:
                    type: string
                    example: 1.0.0
                  database:
                    type: string
                    enum: [error]
                    example: error
                  timestamp:
                    type: string
                    format: date-time

  # ── Autenticação ──────────────────────────────────────────────────────────────
  /auth/cpf:
    post:
      tags: [Autenticação]
      summary: Autenticar cliente por CPF e obter token JWT (perfil customer)
      description: |
        **Servida pela Lambda `auth-cpf` através do API Gateway, não pela aplicação PHP.**
        A rota fica **fora** do prefixo `/api`: no gateway ela é `POST {apigw}/auth/cpf`
        (nos servidores declarados acima, que já incluem `/api`, use `../auth/cpf`).

        Aceita **somente CPF** (11 dígitos, com ou sem máscara); CNPJ é recusado com `400`.
        O token devolvido é o mesmo bearer HS256 aceito pela aplicação, com `role=customer`,
        `sub` = id do cliente e as claims `cpf` e `name`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf:
                  type: string
                  description: CPF com ou sem máscara
                  example: 529.982.247-25
            example:
              cpf: "52998224725"
      responses:
        '200':
          description: CPF válido e cliente ACTIVE
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn:
                    type: integer
                    description: Validade do token em segundos
                    example: 3600
                  customer:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn: 3600
                customer:
                  id: 11111111-1111-4111-8111-111111111111
                  name: Maria Souza
        '400':
          description: |
            CPF com dígito verificador inválido, CNPJ, ou campo `cpf` ausente/vazio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cpfInvalido:
                  summary: Dígito verificador inválido (ou CNPJ)
                  value:
                    error: CPF inválido.
                cpfAusente:
                  summary: Campo ausente ou vazio
                  value:
                    error: O campo cpf é obrigatório.
        '403':
          description: Cliente com status INACTIVE ou BLOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cliente inativo. Procure a oficina.
        '404':
          description: CPF não cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cliente não encontrado.
        '500':
          description: Falha de banco ou erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Erro interno.

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Realizar login do administrador e obter token JWT (perfil admin)
      description: |
        Emite o bearer JWT de `role=admin`. É a única rota de `/api/**` liberada sem token pelo
        authorizer do API Gateway. Throttling é aplicado no estágio do gateway.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
            example:
              username: admin
              password: admin123
      responses:
        '200':
          description: Token gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Clientes ──────────────────────────────────────────────────────────────────
  /customers:
    get:
      tags: [Clientes]
      summary: Listar todos os clientes
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Clientes]
      summary: Criar novo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, document]
              properties:
                name:
                  type: string
                  example: João da Silva
                document:
                  type: string
                  description: CPF ou CNPJ (com ou sem formatação)
                  example: 529.982.247-25
                status:
                  allOf:
                    - $ref: '#/components/schemas/CustomerStatus'
                  description: Opcional; assume `ACTIVE` quando ausente
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Opcional
                  example: joao.silva@example.com
                phone:
                  type: string
                  nullable: true
                  description: Opcional; aceita máscara e é normalizado para dígitos
                  example: (11) 98765-4321
            example:
              name: João da Silva
              document: "529.982.247-25"
              status: ACTIVE
              email: joao.silva@example.com
              phone: (11) 98765-4321
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Clientes]
      summary: Buscar cliente por ID
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clientes]
      summary: Atualizar cliente (nome, situação e contato)
      description: |
        O documento é imutável. Campos opcionais ausentes preservam o valor atual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: João Atualizado da Silva
                status:
                  allOf:
                    - $ref: '#/components/schemas/CustomerStatus'
                  description: Opcional; mantém o status atual quando ausente
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Opcional; mantém o valor atual quando ausente
                  example: joao.silva@example.com
                phone:
                  type: string
                  nullable: true
                  description: Opcional; mantém o valor atual quando ausente
                  example: (11) 98765-4321
            example:
              name: João Atualizado da Silva
              status: BLOCKED
              email: joao.silva@example.com
              phone: (11) 98765-4321
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Clientes]
      summary: Remover cliente
      responses:
        '204':
          description: Cliente removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Veículos ──────────────────────────────────────────────────────────────────
  /vehicles:
    get:
      tags: [Veículos]
      summary: Listar todos os veículos
      responses:
        '200':
          description: Lista de veículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      tags: [Veículos]
      summary: Cadastrar veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, license_plate, brand, model, year]
              properties:
                customer_id:
                  type: string
                  format: uuid
                license_plate:
                  type: string
                  example: ABC-1234
                brand:
                  type: string
                  example: Toyota
                model:
                  type: string
                  example: Corolla
                year:
                  type: integer
                  minimum: 1886
                  example: 2020
            example:
              customer_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              license_plate: ABC-1234
              brand: Toyota
              model: Corolla
              year: 2020
      responses:
        '201':
          description: Veículo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /vehicles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Veículos]
      summary: Buscar veículo por ID
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Veículos]
      summary: Atualizar dados do veículo (brand, model, year)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, model, year]
              properties:
                brand:
                  type: string
                  example: Honda
                model:
                  type: string
                  example: Civic
                year:
                  type: integer
                  example: 2022
      responses:
        '200':
          description: Veículo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Veículos]
      summary: Remover veículo
      responses:
        '204':
          description: Veículo removido
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Peças ─────────────────────────────────────────────────────────────────────
  /parts:
    get:
      tags: [Peças]
      summary: Listar peças do catálogo
      responses:
        '200':
          description: Lista de peças
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Part'
    post:
      tags: [Peças]
      summary: Cadastrar peça
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, price]
              properties:
                description:
                  type: string
                  example: Filtro de óleo
                price:
                  type: number
                  example: 45.90
                stock_quantity:
                  type: integer
                  default: 0
                  example: 50
            example:
              description: Filtro de óleo
              price: 45.90
              stock_quantity: 50
      responses:
        '201':
          description: Peça criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/BadRequest'

  /parts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Peças]
      summary: Buscar peça por ID
      responses:
        '200':
          description: Peça encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Peças]
      summary: Atualizar dados da peça (descrição e preço)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, price]
              properties:
                description:
                  type: string
                  example: Filtro de óleo premium
                price:
                  type: number
                  example: 52.00
      responses:
        '200':
          description: Peça atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Peças]
      summary: Remover peça
      responses:
        '204':
          description: Peça removida
        '404':
          $ref: '#/components/responses/NotFound'

  /parts/{id}/stock:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Peças]
      summary: Repor estoque de peça (adiciona quantidade ao estoque atual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  example: 20
      responses:
        '200':
          description: Estoque atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Serviços ──────────────────────────────────────────────────────────────────
  /service-items/metrics:
    get:
      tags: [Serviços]
      summary: Métricas de uso dos serviços (tempo estimado e quantidade de ordens)
      responses:
        '200':
          description: Métricas por serviço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceItemMetric'

  /service-items:
    get:
      tags: [Serviços]
      summary: Listar catálogo de serviços
      responses:
        '200':
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceItem'
    post:
      tags: [Serviços]
      summary: Cadastrar serviço no catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, base_price]
              properties:
                description:
                  type: string
                  example: Troca de óleo
                base_price:
                  type: number
                  example: 150.00
                estimated_time_minutes:
                  type: integer
                  default: 0
                  example: 60
            example:
              description: Troca de óleo
              base_price: 150.00
              estimated_time_minutes: 60
      responses:
        '201':
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /service-items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Serviços]
      summary: Buscar serviço por ID
      responses:
        '200':
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Serviços]
      summary: Atualizar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, base_price]
              properties:
                description:
                  type: string
                  example: Troca de óleo sintético
                base_price:
                  type: number
                  example: 180.00
                estimated_time_minutes:
                  type: integer
                  example: 75
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Serviços]
      summary: Remover serviço do catálogo
      responses:
        '204':
          description: Serviço removido
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Ordens de Serviço ─────────────────────────────────────────────────────────
  /service-orders:
    get:
      tags: [Ordens de Serviço]
      summary: Listar ordens de serviço ativas
      description: |
        Retorna as ordens **ativas** ordenadas por prioridade de fluxo
        (`EXECUTING` > `AWAITING_APPROVAL` > `DIAGNOSIS` > `RECEIVED`) e, dentro de
        cada status, das mais antigas para as mais recentes. Ordens `FINISHED` e
        `DELIVERED` são excluídas da listagem (exclusão lógica, não física).
      responses:
        '200':
          description: Lista de ordens ativas ordenadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOrder'
    post:
      tags: [Ordens de Serviço]
      summary: Criar nova ordem de serviço (status inicial RECEIVED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, vehicle_id]
              properties:
                customer_id:
                  type: string
                  format: uuid
                vehicle_id:
                  type: string
                  format: uuid
            example:
              customer_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              vehicle_id: 8b1e4d07-1234-4000-a000-000000000001
      responses:
        '201':
          description: Ordem criada com status RECEIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /service-orders/me:
    get:
      tags: [Ordens de Serviço]
      summary: Ordens de serviço do próprio cliente autenticado
      description: |
        Devolve **apenas** as ordens do cliente identificado pela claim `sub` do token — o id
        nunca vem de parâmetro de entrada. Aceita `role=customer` e `role=admin`.

        Substitui a antiga rota pública `GET /api/service-orders/status`, **removida** por
        aceitar `document` e `license_plate` em query string e expor ordens de qualquer CPF.
      responses:
        '200':
          description: Ordens do cliente, das mais recentes para as mais antigas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /service-orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Ordens de Serviço]
      summary: Buscar ordem por ID
      description: |
        Acesso: `role=admin`, ou o `role=customer` **dono** da ordem (claim `sub` igual ao
        cliente da ordem).

        Um cliente que consulta a ordem de outro recebe **`404`, não `403`** — responder `403`
        confirmaria a existência da ordem.
      responses:
        '200':
          description: Ordem encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Ordem inexistente — ou pertencente a outro cliente, quando o token é de `customer`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /service-orders/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Ordens de Serviço]
      summary: Adicionar serviços e peças à ordem
      description: |
        Adiciona serviços e peças a uma ordem de serviço existente.
        A adição de peças valida o estoque disponível e decrementa atomicamente
        dentro de uma transação de banco de dados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_item_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  example: ["svc-uuid-1", "svc-uuid-2"]
                parts:
                  type: array
                  items:
                    type: object
                    required: [part_id, quantity]
                    properties:
                      part_id:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
            example:
              service_item_ids: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
              parts:
                - part_id: "8b1e4d07-0000-4000-a000-000000000001"
                  quantity: 2
      responses:
        '200':
          description: Itens adicionados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Estoque insuficiente ou regra de negócio violada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /service-orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Ordens de Serviço]
      summary: Alterar status da ordem de serviço
      description: |
        **Transições válidas (máquina de estados):**

        ```
        RECEIVED → DIAGNOSIS → AWAITING_APPROVAL → EXECUTING → FINISHED → DELIVERED
        ```

        - `DIAGNOSIS`: inicia o diagnóstico do veículo
        - `AWAITING_APPROVAL`: envia orçamento para aprovação (calcula total)
        - `EXECUTING`: aprova o orçamento e inicia execução
        - `FINISHED`: finaliza a execução dos serviços
        - `DELIVERED`: entrega o veículo ao cliente

        Cada mudança de status dispara uma notificação por email quando o SMTP
        está configurado (`SMTP_HOST`/`MAIL_TO`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
            example:
              status: DIAGNOSIS
      responses:
        '200':
          description: Status alterado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          description: Status inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Transição de status inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /service-orders/{id}/approval:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Ordens de Serviço]
      summary: Aprovar ou recusar o orçamento (notificação externa)
      description: |
        Endpoint para um canal externo notificar a decisão do cliente sobre o
        orçamento de uma ordem em `AWAITING_APPROVAL`:

        - `approved: true` → aprova e move a ordem para `EXECUTING`
        - `approved: false` → recusa e move a ordem para `REJECTED`

        Protegido por token compartilhado: o header `X-Webhook-Token` é **sempre obrigatório**
        e precisa bater com o segredo `WEBHOOK_TOKEN`. Se o segredo não estiver configurado no
        ambiente, a rota responde `401` — nunca fica aberta.
      security: []
      parameters:
        - name: X-Webhook-Token
          in: header
          required: true
          schema:
            type: string
          description: Token compartilhado do webhook (obrigatório)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                  description: "true aprova (→ EXECUTING); false recusa (→ REJECTED)"
            example:
              approved: true
      responses:
        '200':
          description: Decisão aplicada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          description: Campo "approved" ausente ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token de webhook ausente, inválido ou não configurado no ambiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Ordem não está em AWAITING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
