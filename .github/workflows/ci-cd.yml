name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Unit & integration tests
        run: vendor/bin/phpunit --no-coverage

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Code style (PSR-12)
        run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --diff

  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference (lowercase)
        id: image
        run: echo "ref=$(echo "${IMAGE_NAME}:${GITHUB_SHA}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: oficina

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image into cluster
        run: |
          docker pull "${{ needs.build.outputs.image }}"
          kind load docker-image "${{ needs.build.outputs.image }}" --name oficina

      - name: Pin manifests to the built image
        run: sed -i "s#oficina-api:local#${{ needs.build.outputs.image }}#g" k8s/*.yaml

      - name: Apply manifests (Deployment, Service, ConfigMap, Secret, HPA, DB)
        run: |
          kubectl apply -k k8s/
          kubectl -n oficina rollout status statefulset/oficina-db --timeout=180s

      - name: Run database migration Job
        run: |
          kubectl -n oficina delete job oficina-migrate --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl -n oficina wait --for=condition=complete job/oficina-migrate --timeout=180s

      - name: Wait for API rollout
        run: kubectl -n oficina rollout status deployment/oficina-api --timeout=180s

      - name: Smoke test the API
        run: |
          kubectl -n oficina port-forward svc/oficina-api 8080:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fs http://localhost:8080/api/health | grep -q '"database":"connected"'
