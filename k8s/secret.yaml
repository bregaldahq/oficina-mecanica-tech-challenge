apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
# WARNING: these are placeholder values for local/staging only.
# For real environments do NOT commit secrets — create them out-of-band, e.g.:
#   kubectl -n oficina create secret generic oficina-secret \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=... ...
# The CI/CD pipeline provisions this Secret from the repository's encrypted secrets.
type: Opaque
stringData:
  DB_USERNAME: "oficina_user"
  DB_PASSWORD: "change-me-app-password"
  MYSQL_ROOT_PASSWORD: "change-me-root-password"
  JWT_SECRET: "change-me-super-secret-jwt-key-at-least-32-chars"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "change-me-admin-password"
  WEBHOOK_TOKEN: "change-me-webhook-token"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
