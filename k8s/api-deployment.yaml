apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      # The app containers run as the non-root www-data user (uid/gid 82, baked into
      # the image). fsGroup makes the shared emptyDir group-writable by that gid so
      # the init copy and the .env materialization succeed.
      securityContext:
        fsGroup: 82
      # The production image bakes the app into /var/www/html. We copy it into a
      # shared volume so the Nginx sidecar can serve static assets (Swagger) while
      # PHP-FPM executes the code from the same tree.
      initContainers:
        - name: copy-app
          image: oficina-api:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /var/www/html/. /app-code/"]
          volumeMounts:
            - name: app-code
              mountPath: /app-code
      containers:
        - name: php-fpm
          image: oficina-api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secret
          ports:
            - containerPort: 9000
              name: fpm
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: app-code
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: oficina-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  type: ClusterIP
  selector:
    app: oficina-api
  ports:
    - port: 80
      targetPort: 80
      name: http
