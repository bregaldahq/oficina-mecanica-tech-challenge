apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-migrate
  namespace: oficina
  labels:
    app: oficina-migrate
# Applies src/Infrastructure/Database/schema.sql (idempotent, CREATE ... IF NOT EXISTS).
# Runs as the MySQL root user because the schema issues CREATE DATABASE, which the
# scoped application user is not allowed to do. Re-run with:
#   kubectl -n oficina delete job oficina-migrate --ignore-not-found
#   kubectl -n oficina apply -f k8s/migration-job.yaml
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: oficina-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            ["sh", "-c", "until nc -z oficina-db 3306; do echo 'waiting for database...'; sleep 3; done"]
      containers:
        - name: migrate
          image: oficina-api:local
          imagePullPolicy: IfNotPresent
          args: ["php", "bin/migrate.php"]
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secret
          env:
            # Override the app user with root so CREATE DATABASE in schema.sql succeeds.
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: MYSQL_ROOT_PASSWORD
