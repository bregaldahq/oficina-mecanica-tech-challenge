apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-nginx
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
# In-cluster Nginx config: the PHP-FPM upstream is a sidecar in the same Pod,
# reached over localhost instead of the docker-compose service name.
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location /docs {
            alias /var/www/html/docs;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location = /swagger.yaml {
            alias /var/www/html/swagger.yaml;
            add_header Content-Type "application/yaml";
        }

        location /api {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }
