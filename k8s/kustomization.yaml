apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina

# The migration Job is intentionally excluded — it is applied on demand (and by the
# CI/CD pipeline) so that a routine `kubectl apply -k` does not fail on the immutable Job.
resources:
  - namespace.yaml
  - configmap.yaml
  - nginx-configmap.yaml
  - secret.yaml
  - mysql.yaml
  - api-deployment.yaml
  - hpa.yaml
  - ingress.yaml

# CI overrides newName/newTag to the pushed GHCR image, e.g.:
#   kustomize edit set image oficina-api=ghcr.io/<owner>/oficina-mecanica:<sha>
images:
  - name: oficina-api
    newName: oficina-api
    newTag: local
