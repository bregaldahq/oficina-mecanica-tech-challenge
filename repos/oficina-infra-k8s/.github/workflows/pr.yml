name: PR

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive
        continue-on-error: true

  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        env: [hml, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina/oficina-infra-k8s/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=oficina-tflock" \
            -backend-config="encrypt=true"

      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -lock=false \
            -var-file=envs/${{ matrix.env }}.tfvars \
            -var="newrelic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            -out=tfplan.${{ matrix.env }} | tee plan.txt
          echo 'summary<<EOF' >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### terraform plan — \`${{ matrix.env }}\`\n\n<details><summary>ver plan</summary>\n\n\`\`\`hcl\n${{ steps.plan.outputs.summary }}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
