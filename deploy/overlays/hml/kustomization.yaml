apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Homologação ─────────────────────────────────────────────────────────────
namespace: oficina-hml

resources:
  - ../../base

# Substitui o Namespace da base (nome `oficina`, que não existe em nenhum
# ambiente real) pelo namespace de homologação.
patches:
  - path: namespace.yaml
    target:
      kind: Namespace
      name: oficina
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: external-secret-patch.yaml

configMapGenerator:
  - name: oficina-config
    behavior: merge
    literals:
      - APP_ENV=homologacao
      - APP_DEBUG=false
      - NEW_RELIC_APP_NAME=oficina-api-hml

generatorOptions:
  disableNameSuffixHash: true

# A tag é fixada pelo pipeline:
#   kustomize edit set image oficina-api=<ecr_repository_url>:<git_sha>
images:
  - name: oficina-api
    newName: oficina-api
    newTag: hml
