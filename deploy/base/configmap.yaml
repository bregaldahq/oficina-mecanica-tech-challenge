apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
# Configuração NÃO sensível da aplicação. Tudo que é segredo (senha do RDS, JWT,
# webhook, license key do New Relic) chega pelo Secret `oficina-secret`,
# materializado pelo External Secrets Operator (ver external-secret.yaml).
# DB_HOST/DB_PORT/DB_DATABASE também vêm do Secret (seção 3 dos Contratos) e por
# isso NÃO são declarados aqui — o envFrom do Secret vem depois do ConfigMap.
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  JWT_EXPIRATION: "3600"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  # Sobrescrito por overlay: oficina-api-hml / oficina-api-prod.
  NEW_RELIC_APP_NAME: "oficina-api"
  # Notificações por e-mail (SMTP). Vazio desabilita.
  SMTP_HOST: ""
  SMTP_PORT: "587"
  MAIL_FROM: "no-reply@oficina.local"
  MAIL_TO: ""
