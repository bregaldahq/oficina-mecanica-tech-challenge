# D19 — External Secrets Operator.
#
# Materializa o Secret `oficina-secret` no namespace a partir dos segredos
# `oficina/<env>/db` e `oficina/<env>/auth` do AWS Secrets Manager (donos:
# repositório `oficina-infra-database`, seção 3 dos Contratos).
#
# O ClusterSecretStore `oficina-secretsmanager` é criado pelo repositório
# `oficina-infra-k8s` (IRSA + provider AWS) — aqui apenas o referenciamos.
#
# Os nomes dos segredos (`oficina/<env>/...`) são ajustados por patch em cada
# overlay; a base usa `hml` como valor default.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oficina-secret
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oficina-secretsmanager
    kind: ClusterSecretStore
  target:
    name: oficina-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # ── oficina/<env>/db ────────────────────────────────────────────────────
    - secretKey: DB_HOST
      remoteRef: { key: oficina/hml/db, property: host }
    - secretKey: DB_PORT
      remoteRef: { key: oficina/hml/db, property: port }
    - secretKey: DB_DATABASE
      remoteRef: { key: oficina/hml/db, property: dbname }
    - secretKey: DB_USERNAME
      remoteRef: { key: oficina/hml/db, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: oficina/hml/db, property: password }
    # ── oficina/<env>/auth ──────────────────────────────────────────────────
    - secretKey: JWT_SECRET
      remoteRef: { key: oficina/hml/auth, property: JWT_SECRET }
    - secretKey: JWT_EXPIRATION
      remoteRef: { key: oficina/hml/auth, property: JWT_EXPIRATION }
    - secretKey: ADMIN_USERNAME
      remoteRef: { key: oficina/hml/auth, property: ADMIN_USERNAME }
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: oficina/hml/auth, property: ADMIN_PASSWORD }
    - secretKey: WEBHOOK_TOKEN
      remoteRef: { key: oficina/hml/auth, property: WEBHOOK_TOKEN }
