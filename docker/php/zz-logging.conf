; Faz a saida dos workers do PHP-FPM chegar ao stdout do container.
;
; Por padrao o FPM nao repassa o que os workers escrevem em php://stdout: o
; master os isola, e a saida e' simplesmente descartada. O JsonLogger emitia
; cada linha corretamente e nenhuma delas saia do pod — o Fluent Bit nunca via
; nada, e o requisito de log estruturado com correlacao existia so' no codigo.
;
; Nome com zz- para o include do FPM carregar depois de www.conf e sobrescrever.

[global]
; Erros do proprio master vao para o stderr do container.
error_log = /proc/self/fd/2

[www]
; Repassa stdout e stderr dos workers.
catch_workers_output = yes

; Sem prefixo "NOTICE: PID x" — quebraria o parse do JSON pelo Fluent Bit.
decorate_workers_output = no

; O acesso ja e' registrado pelo JsonLogger, com correlation_id. O log de acesso
; do FPM seria uma segunda linha por request, sem o id, so' poluindo.
access.log = /dev/null
