; ── Agente PHP do New Relic ──────────────────────────────────────────────────
; A extensão é SEMPRE carregada (aparece em `php -m`), mas fica inerte quando
; NEW_RELIC_LICENSE_KEY está vazia: o docker-entrypoint.sh exporta
; NEW_RELIC_ENABLED=false e NEW_RELIC_DAEMON_DONT_LAUNCH=3 nesse caso, então
; nenhum dado é coletado, nenhum daemon sobe e nada é escrito em stdout.
extension = newrelic.so

newrelic.appname  = "${NEW_RELIC_APP_NAME}"
newrelic.license  = "${NEW_RELIC_LICENSE_KEY}"
newrelic.enabled = "${NEW_RELIC_ENABLED}"
newrelic.monitor_mode = "${NEW_RELIC_MONITOR_MODE}"
newrelic.daemon.dont_launch = "${NEW_RELIC_DAEMON_DONT_LAUNCH}"
newrelic.distributed_tracing_enabled = "${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED}"

; Logs do agente fora do stdout da aplicação (o stdout é reservado ao log
; estruturado JSON de request, ver seção 7 dos Contratos).
newrelic.loglevel        = error
newrelic.logfile         = /var/log/newrelic/php_agent.log
newrelic.daemon.loglevel = error
newrelic.daemon.logfile  = /var/log/newrelic/newrelic-daemon.log
