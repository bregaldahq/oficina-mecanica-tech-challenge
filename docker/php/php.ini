; ── Production PHP configuration ─────────────────────────────────────────────

; Environment
; Expose real environment variables (Docker/Kubernetes) through $_ENV so the
; application can read injected ConfigMap/Secret values.
variables_order     = "EGPCS"

; Security
expose_php          = Off
display_errors      = Off
display_startup_errors = Off

; Logging
log_errors          = On
error_log           = /var/log/php/error.log
error_reporting     = E_ALL

; Performance
memory_limit        = 128M
max_execution_time  = 30
max_input_time      = 30

; Upload
upload_max_filesize = 8M
post_max_size       = 10M

; Session (not used in this stateless API, but good practice)
session.cookie_httponly = 1
session.cookie_secure   = 1
session.use_strict_mode = 1

; Date
date.timezone = America/Sao_Paulo
